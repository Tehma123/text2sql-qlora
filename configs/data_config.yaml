# Data preparation config

dataset_name: spider
raw_dir: data/raw
processed_dir: data/processed

# Covers 99%+ of Spider examples once tokenized (measured with the real base
# model tokenizer -- see reports/data_preparation.md); examples still over
# this budget are dropped during preprocessing rather than truncated, since
# truncation would clip the gold SQL answer instead of the schema.
max_seq_length: 1536

# Output splits produced by preprocessing
train_file: data/processed/train.json
dev_file: data/processed/dev.json
test_file: data/processed/test.json
