# QLoRA fine-tuning config
# Defaults sized for a single 12GB consumer GPU (e.g. RTX 3060 12GB)

# Was Qwen/Qwen2.5-Coder-7B-Instruct -- switched to 3B after a real training
# run on 7B (not just the single-step vram_check.py measurement below) hit
# ~11.3GB/12GB dedicated VRAM and nearly exhausted BAR1 memory once real,
# varied batches ran for hours, throttling Unsloth's CPU-offloaded gradient
# checkpointing and slowing training to ~5x the originally-measured rate.
# See reports/qlora_training.md for the full incident writeup.
base_model: Qwen/Qwen2.5-Coder-3B-Instruct
output_dir: checkpoints

quantization:
  load_in_4bit: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  max_seq_length: 1536
  # Re-measured against the 3B model after the 7B pivot (scripts/check_vram.py
  # --backend unsloth --batch-size 2): peak 4.09GB allocated / 4.72GB
  # reserved for one training step -- well under half of what 7B used
  # (8.36GB / 9.92GB), with over 7GB of the 12GB card still free at that
  # point. Worth the caveat: the 7B number also looked comfortable from a
  # single near-worst-case step and still underpredicted real sustained-run
  # VRAM/BAR1 pressure once already (reports/qlora_training.md has the full
  # incident) -- but the margin here is now large enough that a similar
  # proportional miss would be very unlikely to matter.
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  num_train_epochs: 3
  # PyYAML only parses scientific notation as a float when the mantissa has a
  # decimal point ("2e-4" loads as the *string* "2e-4", not 0.0002) -- keep
  # the ".0" here or it'll silently break anything that expects a float.
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.01
  logging_steps: 10
  save_strategy: epoch
  eval_strategy: epoch
  # 8-bit optimizer states (bitsandbytes) -- LoRA-only trainable params make
  # this a small saving in absolute terms, but it's free extra headroom on
  # top of the margin measured in vram_check.py, and is Unsloth's own
  # default recommendation for this exact setup.
  optim: adamw_8bit

experiment_tracking:
  provider: wandb
  project: text2sql-qlora
