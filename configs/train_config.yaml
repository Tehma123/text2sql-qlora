# QLoRA fine-tuning config
# Defaults sized for a single 12GB consumer GPU (e.g. RTX 3060 12GB)

# Was Qwen/Qwen2.5-Coder-7B-Instruct -- switched to 3B after a real training
# run on 7B (not just the single-step vram_check.py measurement below) hit
# ~11.3GB/12GB dedicated VRAM and nearly exhausted BAR1 memory once real,
# varied batches ran for hours, throttling Unsloth's CPU-offloaded gradient
# checkpointing and slowing training to ~5x the originally-measured rate.
# See reports/qlora_training.md for the full incident writeup.
base_model: Qwen/Qwen2.5-Coder-3B-Instruct
# v2: retrain after the composite-primary-key schema fix (see
# src/text2sql/data/schema_utils.py). The first run's checkpoints stay in
# checkpoints/ itself (checkpoint-536 is what demo/app.py and the reports use).
output_dir: checkpoints/v2

quantization:
  load_in_4bit: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  max_seq_length: 1536
  # Re-measured against the 3B model after the 7B pivot (scripts/check_vram.py
  # --backend unsloth --batch-size 2): peak 4.09GB allocated / 4.72GB
  # reserved for one training step -- well under half of what 7B used
  # (8.36GB / 9.92GB), with over 7GB of the 12GB card still free at that
  # point. Worth the caveat: the 7B number also looked comfortable from a
  # single near-worst-case step and still underpredicted real sustained-run
  # VRAM/BAR1 pressure once already (reports/qlora_training.md has the full
  # incident) -- but the margin here is now large enough that a similar
  # proportional miss would be very unlikely to matter.
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  # Was 3. In the first run eval_loss was already rising by step 1072 and
  # epoch 3 cost 7.4pt dev execution_accuracy (significant; epoch 2 vs. 1
  # was not), so nothing past 2 epochs (1,072 steps) helps. The bigger
  # effect is on the cosine LR schedule, which spans the whole run: at step
  # 536 LR is now ~1.05e-4 instead of ~1.56e-4, and it reaches 0 at 1072
  # instead of still being ~5.3e-5 there -- the low-LR end of training now
  # falls inside the window where the best checkpoint was found, instead of
  # every candidate being a high-LR mid-run snapshot.
  num_train_epochs: 2
  # PyYAML only parses scientific notation as a float when the mantissa has a
  # decimal point ("2e-4" loads as the *string* "2e-4", not 0.0002) -- keep
  # the ".0" here or it'll silently break anything that expects a float.
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.01
  logging_steps: 10
  # Was per-epoch (steps 536/1072/1608): eval_loss was already lowest at the
  # first of those three points (0.2635 -> 0.2883 -> 0.3618), so its true
  # minimum could be anywhere before step 1072, and the per-epoch grid can't
  # say where. Every 100 steps puts 5 evals before the old epoch-1 checkpoint;
  # one eval on the full dev set takes ~200s, about 13% on top of 100 steps
  # of training (~15s/step) vs. ~26% at every 50.
  eval_strategy: steps
  eval_steps: 100
  save_strategy: steps
  save_steps: 100
  # No early stopping. v2 first ran with early_stopping_patience: 4 on
  # eval_loss and stopped at step 600 -- eval_loss bottomed out at step 200
  # (0.2255) and rose steadily after, but dev execution_accuracy went the
  # other way: ~72% for steps 200-500, then 76.4% at step 600 (vs. 73.4% for
  # v1's checkpoint-536, p=0.004). eval_loss is the wrong stopping signal for
  # this task, so every checkpoint is kept and the shipped one is picked by
  # scripts/evaluate.py on dev. (Setting this to an integer turns early
  # stopping on eval_loss back on, with the best-eval_loss checkpoint saved
  # as final/.)
  early_stopping_patience: null
  # 8-bit optimizer states (bitsandbytes) -- LoRA-only trainable params make
  # this a small saving in absolute terms, but it's free extra headroom on
  # top of the margin measured in vram_check.py, and is Unsloth's own
  # default recommendation for this exact setup.
  optim: adamw_8bit

experiment_tracking:
  provider: wandb
  project: text2sql-qlora
