# QLoRA fine-tuning config
# Defaults sized for a single 12GB consumer GPU (e.g. RTX 3060 12GB)

base_model: Qwen/Qwen2.5-Coder-7B-Instruct
output_dir: checkpoints

quantization:
  load_in_4bit: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  max_seq_length: 1536
  # Verified with scripts/check_vram.py --backend unsloth --batch-size 2 on
  # a real RTX 3060 12GB: peak 8.36GB allocated / 9.92GB reserved for one
  # training step at this max_seq_length -- comfortable headroom. The same
  # config under plain peft/bitsandbytes (no Unsloth) peaked at 16.5GB and
  # didn't fit even at batch_size=1 (12.97GB reserved) -- Qwen's 152K
  # vocabulary makes the loss computation's fp32 logits the dominant cost,
  # which is specifically what Unsloth's fused kernels avoid. See
  # reports/data_preparation.md for the full comparison.
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  num_train_epochs: 3
  # PyYAML only parses scientific notation as a float when the mantissa has a
  # decimal point ("2e-4" loads as the *string* "2e-4", not 0.0002) -- keep
  # the ".0" here or it'll silently break anything that expects a float.
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  logging_steps: 10
  save_strategy: epoch

experiment_tracking:
  provider: wandb
  project: text2sql-qlora
